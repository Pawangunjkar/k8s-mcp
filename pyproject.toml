[project]
name = "k8s-cloud-deploy-mcp"
version = "1.1.0"
description = "MCP server for Kubernetes, OpenShift, and cloud-managed cluster deployment"
requires-python = ">=3.10"
authors = [{ name = "Pawan Gunjkar", email = "pawangunjkar@gmail.com" }]
readme = "README.md"
license = { text = "MIT" }
keywords = ["mcp", "kubernetes", "openshift", "eks", "aks", "gke", "devops"]
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Topic :: System :: Systems Administration",
]
dependencies = [
    "mcp[cli]>=1.30.0,<2",
    "kubernetes>=36.0.3,<37",
    "httpx>=0.28.1,<1",
    "pydantic>=2.13.5,<3",
    "pyyaml>=6.0.3,<7",
]

[project.urls]
Homepage = "https://github.com/Pawangunjkar/k8s-mcp"
Repository = "https://github.com/Pawangunjkar/k8s-mcp"

[project.scripts]
k8s-cloud-deploy-mcp = "k8s_cloud_deploy_mcp.server:main"
k8s-mcp = "k8s_cloud_deploy_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["k8s_cloud_deploy_mcp"]

[tool.hatch.build.targets.sdist]
include = [
    "k8s_cloud_deploy_mcp",
    "README.md",
    "LICENSE",
]
