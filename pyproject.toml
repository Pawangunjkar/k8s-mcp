[project]
name = "pawangunjkar-k8s-mcp"
version = "1.0.0"
description = "MCP server for Kubernetes — pods, logs, deployments, services, scale, and restart"
requires-python = ">=3.10"
authors = [{ name = "Pawan Gunjkar", email = "pawangunjkar@gmail.com" }]
readme = "README.md"
license = { text = "MIT" }
keywords = ["mcp", "kubernetes", "k8s", "devops"]
dependencies = [
    "mcp[cli]>=1.0.0,<2",
    "kubernetes>=31.0.0",
    "pyyaml>=6.0.0",
]

[project.scripts]
pawangunjkar-k8s-mcp = "server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]
